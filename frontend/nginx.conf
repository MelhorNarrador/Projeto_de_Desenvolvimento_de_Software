server {
    listen 80;

    location /api/ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
